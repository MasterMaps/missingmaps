<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What we mapped — #iugnorge</title>
    <meta
      name="description"
      content="Every building, road and waterway that Ingeniører Uten Grenser Norge has added to OpenStreetMap, highlighted on the map."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗺️</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>What we mapped</h1>
        <p class="tagline">
          Everything <code id="hashtag">#iugnorge</code> has added to OpenStreetMap
        </p>
      </div>

      <div class="controls">
        <label class="field">
          <span>Project</span>
          <select id="project"></select>
        </label>
        <button id="back" type="button" hidden>Back to project</button>
      </div>
    </header>

    <div id="project-info" class="project-info"></div>

    <main id="map" class="map"></main>

    <div id="status" class="status" hidden></div>

    <footer class="footer">
      <span id="dataset-note"></span>
      <span>
        Map data ©
        <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> · basemap
        <a href="https://openfreemap.org/">OpenFreeMap</a> · projects via
        <a href="https://tasks.hotosm.org/">HOT Tasking Manager</a>
      </span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

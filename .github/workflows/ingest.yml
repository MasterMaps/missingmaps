name: Update project list

on:
  schedule:
    # Every six hours. Each run walks the OSM changeset replication feed from
    # where the previous one stopped, so a missed run is picked up by the next.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'replication (recent), planet (full history, ~15 min), osmcha (per mapper), touched, or all'
        type: choice
        default: replication
        options: [replication, planet, osmcha, touched, all]
      since:
        description: 'osmcha only — backfill from this date'
        default: '2019-01-01'

permissions:
  contents: write
  actions: write # to kick off a tile rebuild for whatever changed

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ingest changesets
        id: ingest
        env:
          OSMCHA_TOKEN: ${{ secrets.OSMCHA_TOKEN }}
        run: |
          node scripts/ingest.mjs "${{ inputs.mode || 'replication' }}" \
            --minutes 900 \
            --since "${{ inputs.since || '2019-01-01' }}"

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/projects.json
          git diff --cached --quiet && echo 'no new projects or changesets' && exit 0
          git commit -m 'data: refresh #iugnorge project list'
          git pull --rebase --autostash
          git push

      # A mapathon shows up here first. Rebuilding the tiles for just those
      # projects reuses the cached extracts for everything else, so it is
      # minutes rather than the hour a full build takes.
      - name: Rebuild tiles for the projects that changed
        if: steps.ingest.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "changed: ${{ steps.ingest.outputs.changed }}"
          gh workflow run tiles.yml -f only='${{ steps.ingest.outputs.changed }}'
